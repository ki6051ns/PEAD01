<svg xmlns="http://www.w3.org/2000/svg" width="720" height="985" viewBox="0 0 720 985">
<title>Blank Dynamicの学習窓：学習期間を6つのブランクでスライドし、候補を動的配分</title>
<desc>各ブランク0、5、10、20、40、60営業日に対し、同じ1008営業日の学習窓をずらしてシャープレシオ首位を選ぶ。共通学習区間の末尾63日Sharpeに基づき候補のウェイトを決定する。</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;fill:#E8F1FC}
.heading{font-size:19px;font-weight:700}.sub{font-size:16px;fill:#B9C7D8}.row-label{font-size:19px}
.small{font-size:13px;fill:#D3DFEC}.card{font-size:20px;font-weight:700}.note{font-size:13px;fill:#B6C5D7}
</style>
<rect width="720" height="985" fill="#0E1625"/>
<rect x="15" y="16" width="690" height="951" rx="15" fill="#111C2C" stroke="#26344A"/>
<text x="37" y="53" class="heading">Blank Dynamicの学習窓（模式図）</text>
<text x="180" y="99" class="sub">過去</text>
<line x1="235" y1="92" x2="649" y2="92" stroke="#72809A" stroke-width="2"/>
<path d="M641 86 L650 92 L641 98" stroke="#72809A" fill="none" stroke-width="2"/>
<text x="555" y="117" class="sub" font-weight="700">WF開始</text>
<line x1="650" y1="120" x2="650" y2="472" stroke="#F2A500" stroke-width="3" stroke-dasharray="7 6"/>
<text x="34" y="160" class="row-label">b=60</text>
<rect x="115" y="135" width="330" height="34" rx="4" fill="#477AAE"/>
<rect x="405" y="135" width="40" height="34" fill="#238984"/>
<rect x="445" y="135" width="205" height="34" rx="3" fill="#A6ADB8"/>
<text x="34" y="214" class="row-label">b=40</text>
<rect x="157" y="189" width="330" height="34" rx="4" fill="#477AAE"/>
<rect x="447" y="189" width="40" height="34" fill="#238984"/>
<rect x="487" y="189" width="163" height="34" rx="3" fill="#A6ADB8"/>
<text x="34" y="268" class="row-label">b=20</text>
<rect x="199" y="243" width="330" height="34" rx="4" fill="#477AAE"/>
<rect x="489" y="243" width="40" height="34" fill="#238984"/>
<rect x="529" y="243" width="121" height="34" rx="3" fill="#A6ADB8"/>
<text x="34" y="322" class="row-label">b=10</text>
<rect x="220" y="297" width="330" height="34" rx="4" fill="#477AAE"/>
<rect x="510" y="297" width="40" height="34" fill="#238984"/>
<rect x="550" y="297" width="100" height="34" rx="3" fill="#A6ADB8"/>
<text x="34" y="376" class="row-label">b=5</text>
<rect x="230.5" y="351" width="330" height="34" rx="4" fill="#477AAE"/>
<rect x="520.5" y="351" width="40" height="34" fill="#238984"/>
<rect x="560.5" y="351" width="89.5" height="34" rx="3" fill="#A6ADB8"/>
<text x="34" y="430" class="row-label">b=0</text>
<rect x="241" y="405" width="330" height="34" rx="4" fill="#477AAE"/>
<rect x="531" y="405" width="40" height="34" fill="#238984"/>

<text x="189" y="509" class="sub">青：学習窓（各1,008営業日）</text>
<rect x="40" y="535" width="14" height="12" rx="2" fill="#477AAE"/><text x="60" y="547" class="small">学習データ</text>
<rect x="208" y="535" width="14" height="12" rx="2" fill="#A6ADB8"/><text x="228" y="547" class="small">ブランク（不使用）</text>
<rect x="411" y="535" width="14" height="12" rx="2" fill="#238984"/><text x="431" y="547" class="small">学習窓の末尾</text>
<text x="40" y="572" class="note">各窓の長さは同じで、終了日が異なります。横幅は厳密な日数比率ではありません。</text>
<text x="40" y="613" class="heading">各学習窓でSharpe首位の売買ルールを選択（例）</text>
<rect x="38" y="630" width="209" height="82" rx="10" fill="#0C1728" stroke="#26344A"/>
<text x="142" y="653" class="small" text-anchor="middle">ブランク0日</text>
<text x="142" y="674" class="small" text-anchor="middle">↓</text>
<text x="142" y="695" class="card" text-anchor="middle">候補A</text>
<rect x="260" y="630" width="209" height="82" rx="10" fill="#0C1728" stroke="#26344A"/>
<text x="364" y="653" class="small" text-anchor="middle">ブランク5日</text>
<text x="364" y="674" class="small" text-anchor="middle">↓</text>
<text x="364" y="695" class="card" text-anchor="middle">候補B</text>
<rect x="482" y="630" width="209" height="82" rx="10" fill="#0C1728" stroke="#26344A"/>
<text x="586" y="653" class="small" text-anchor="middle">ブランク10日</text>
<text x="586" y="674" class="small" text-anchor="middle">↓</text>
<text x="586" y="695" class="card" text-anchor="middle">候補A</text>
<rect x="38" y="723" width="209" height="82" rx="10" fill="#0C1728" stroke="#26344A"/>
<text x="142" y="746" class="small" text-anchor="middle">ブランク20日</text>
<text x="142" y="767" class="small" text-anchor="middle">↓</text>
<text x="142" y="788" class="card" text-anchor="middle">候補C</text>
<rect x="260" y="723" width="209" height="82" rx="10" fill="#0C1728" stroke="#26344A"/>
<text x="364" y="746" class="small" text-anchor="middle">ブランク40日</text>
<text x="364" y="767" class="small" text-anchor="middle">↓</text>
<text x="364" y="788" class="card" text-anchor="middle">候補D</text>
<rect x="482" y="723" width="209" height="82" rx="10" fill="#0C1728" stroke="#26344A"/>
<text x="586" y="746" class="small" text-anchor="middle">ブランク60日</text>
<text x="586" y="767" class="small" text-anchor="middle">↓</text>
<text x="586" y="788" class="card" text-anchor="middle">候補B</text>
<text x="356" y="827" font-size="24" text-anchor="middle">↓</text>
<rect x="40" y="847" width="640" height="72" rx="11" fill="#122C39" stroke="#235A65"/>
<text x="360" y="875" text-anchor="middle" class="heading">Blank Dynamic</text>
<text x="360" y="899" text-anchor="middle" class="small">選ばれた最大6候補を、共通学習期間の直近63営業日のSharpeで動的配分</text>
<text x="40" y="945" class="note">候補A～Dは説明用の架空例。同じ候補が複数ブランクで首位になる場合もあります。</text>
</svg>