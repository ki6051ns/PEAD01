<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 385" width="960" height="385" role="img" aria-labelledby="t d">
<title id="t">PEAD01：更新ごとに移動する学習・内部検証と固定されたWF評価期間</title>
<desc id="d">学習・129営業日のブランク・45営業日の内部検証・5営業日のブランクは各更新日に合わせて移動する。一方、成績集計に使う2025年7月1日から2026年11月13日までの共通WF評価期間334営業日は固定され、その内側で採用ルールを週次・月次・四半期に更新する。位置や幅は模式的なもの。</desc>
<rect width="960" height="385" rx="12" fill="#ffffff"/>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",Meiryo,Arial,sans-serif}
.header{font-size:19px;font-weight:700;fill:#243347}
.sub{font-size:12px;fill:#536277}
.row{font-size:14px;font-weight:650;fill:#243347}
.block{font-size:13px;font-weight:650;fill:#ffffff}
.small{font-size:12px;fill:#536277}
</style>
<text x="32" y="35" class="header">WFの評価期間は固定、学習・内部検証は更新ごとに移動</text>
<text x="32" y="59" class="sub">各更新の直前に候補と配分を決め、その結果を共通の評価期間内で積み上げる（模式図・時間幅は非比例）</text>
